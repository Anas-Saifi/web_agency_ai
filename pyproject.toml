[project]
name = "web-agency-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anas Saifi", email = "anas.saifi123456786@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-auth-oauthlib>=1.4.1",
    "httpx2>=2.12.0",
    "langchain>=1.4.0",
    "langchain-core>=1.6.2",
    "langchain-google-community>=5.0.0",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-openai>=1.6.2",
    "langchain-openrouter>=0.2.8",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "mcp>=1.29.0,<2.0.0",
    "pydantic[email]>=2.13.5",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[project.scripts]
web-agency-ai = "web_agency_ai:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
